<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClickMind | Task Manager</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="assets/logo/ClickMind-Logo.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <!--------------APP------------>

    <div class="app-container">
      <!--------------SIDEBAR------------>

      <aside class="sidebar">
        <div class="logo">
          <img src="assets/logo/ClickMind_DarkLogo.png" alt="ClickMind Logo" />
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Searching for..." />
        </div>

        <div class="sidebar-section">
          <div class="section-heading">
            <h3>Projects</h3>
            <i class="fa-solid fa-chevron-down"></i>
          </div>

          <ul class="sidebar-list">
            <li>All Projects</li>
            <li>Next Task (0)</li>
            <li>Movie Hub (0)</li>
            <li>War_Arena (0)</li>
          </ul>

          <button class="sidebar-btn">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Add a new project</span>
          </button>
        </div>

        <div class="sidebar-section">
          <div class="section-heading">
            <h3>Tasks</h3>
            <i class="fa-solid fa-chevron-down"></i>
          </div>

          <ul class="sidebar-list">
            <li>All (0)</li>
            <li>In Progress (0)</li>
            <li>Done (0)</li>
          </ul>

          <button class="sidebar-btn">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Add a new task</span>
          </button>
        </div>
      </aside>
      <!--------------MAIN CONTENT------------>

      <!--------------HEADER------------>

      <!--------------WELCOME BANNER------------>

      <!--------------STATISTICS------------>

      <!--------------CONTENT GRID------------>

      <!--------------RECENT PROJECTS------------>

      <!--------------CURRENT TASKS------------>
    </div>

    <script src="script.js"></script>
  </body>
</html>
